server {
    server_name midnight.hyperkind.net;

    location ^~ /.well-known/acme-challenge/ { allow all; root /var/www/midnight.hyperkind.net; }
    location ~ /\. { deny all; }

    root /var/www/midnight.hyperkind.net;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /support { try_files /support.html =404; }
    location = /privacy { try_files /privacy.html =404; }
    location = /terms { try_files /terms.html =404; }
    location /apidocs/ { try_files /apidocs.html =404; }
    location = /robots.txt { try_files $uri =404; access_log off; }
    location = /icon.svg { try_files $uri =404; }

    location = /contact {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/contact.php;
        fastcgi_param SCRIPT_NAME /contact;
        client_max_body_size 64k;
    }
    location = /contact/inbox {
        auth_basic "Contact inbox";
        auth_basic_user_file /etc/nginx/.htpasswd-midnight-contact;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/inbox.php;
        fastcgi_param SCRIPT_NAME /contact/inbox;
    }
    location ~ \.php$ { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8799;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    location / { try_files $uri $uri.html $uri/ =404; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/midnight.hyperkind.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/midnight.hyperkind.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = midnight.hyperkind.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    location ^~ /.well-known/acme-challenge/ { allow all; root /var/www/midnight.hyperkind.net; }

    listen 80;
    listen [::]:80;
    server_name midnight.hyperkind.net;
    return 404; # managed by Certbot
}
